# ergo on EC2 — single-container deploy.
# IMPORTANT: do not scale past 1 replica / worker: the job registry is in-memory.
services:
  ergo:
    build: .
    image: ergo:latest
    container_name: ergo
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
