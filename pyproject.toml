[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ergo"
version = "0.1.0"
description = "active-passive ergonomic observation: OpenCV 5 pose gating a Strands/Bedrock agent"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
